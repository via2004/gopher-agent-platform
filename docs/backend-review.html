: "POST /api/v1/conversations/:id/messages", "module": "chat", "note": "JWT；只保存用户消息，不调用模型。"}, {"api": "POST /api/v1/conversations/:id/chat", "module": "chat", "note": "JWT + Chat 额度；普通生成并保存完整回复。"}]}, {"id": "sse", "title": "SSE 流式 Chat", "tag": "传输", "intro": "POST /api/v1/conversations/:id/chat/stream：复用 Chat 业务流程，把生成过程中的正文交给回调发送。", "flow": ["Handler 定义 onDelta", "ChatStreaming 封装 GenerateStream", "Provider 正文 → onDelta → delta + Flush", "Provider response.completed", "事务 B 保存完整回复", "Handler 发 done"], "points": ["generateFunc 抽象生成方式：普通与流式的输入和最终结果形状一致，流式额外通过闭包携带 onDelta。回调不等于新开 goroutine。", "正文一份通过回调输出，一份在内存累积；数据库不逐段写 delta。done 只包含消息 ID、时间、模型和 usage，不含完整正文。", "事件为 delta/error/done。流开始前可能返回普通 HTTP JSON 错误；流开始后业务错误可能在 HTTP 200 内用 error 事件表达。", "模型适配层收到 response.completed 才返回完整结果；Service 提交事务 B 后，Handler 才发送 done。", "客户端没收到 done 表示未确认成功，不能断言服务端没提交。断线后应查询历史确认，不能自动重发写请求。"], "traps": ["上游完成、数据库提交、客户端收到 done 是三个时间点。", "SSE 不绑定 RabbitMQ，没有队列重试。浏览器原生 EventSource 不能直接满足这个 POST + Authorization 协议。"], "sources": [{"path": "internal/chat/service.go", "line": 78, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/chat/service.go#L78"}, {"path": "internal/httpapi/chat_handler.go", "line": 133, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/httpapi/chat_handler.go#L133"}, {"path": "internal/platform/openai/client.go", "line": 341, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/openai/client.go#L341"}], "question": "浏览器已显示全部正文，但保存 AI 回复失败，可以标记成功吗？", "answer": "不可以。应等待 done；若 error 则失败，若断流且无终态则状态未确认。最终持久化情况需查询历史。", "routes": [{"api": "POST /api/v1/conversations/:id/chat/stream", "module": "sse", "note": "JWT + Chat 额度；POST 流式 delta/error/done。"}]}, {"id": "jobs", "title": "ChatJob 与队列", "tag": "异步", "intro": "POST /api/v1/conversations/:id/chat-jobs 创建异步工作；消费者使用非流式生成，前端查询任务后加载消息。", "flow": ["Create：pending Job，保存提问正文", "PublishChatJob：发布 job_id", "HTTP 返回 202", "Claim：processing，attempt_count + 1", "EnsureRequestMessage：创建/复用提问", "FindCompletedAssistantID：查已有回复", "ChatFromExistingMessage → Generate", "Complete 或 Retry/Fail → Ack/Nack"], "points": ["创建接口只创建 Job，不创建 user message。用户消息由消费者处理时创建，并关联 request_message_id；之后重试复用它。", "ChatFromExistingMessage 为已有提问新增调用记录，并进入 respond；上下文从任务执行时的最近历史加载，不是提交时冻结的快照。", "当前 attempt_count 默认 0，在成功领取 pending 任务的 SQL 中加一，包含首次执行。maxAttempts=3 意味着最多三次正常处理尝试，而不是三次额外重试。", "Retry 只恢复数据库 pending、清空 started_at，保留尝试次数和用户消息；Process 返回错误后消费者 Nack(requeue=true)，RabbitMQ 才会重新投递。", "已记录 failed 也返回 nil 并 Ack，因为任务已有终态。Fail 写库失败则返回错误。队列消息的处理完成不等于模型业务成功。", "已有 completed model_call 时复用 assistant ID，只补 Job 完成状态；只减少部分重复执行，不保证端到端 exactly-once。"], "traps": ["当前 ErrJobNotClaimable 统一返回 nil：Retry/Fail 写失败留下 processing 时，重投递可能被 Ack 并遗留状态。恢复方案只是文档，暂缓实现。", "数据库 Job 写入与 MQ 发布不是一个事务；发布失败不回滚 Job，确认丢失时也可能实际上已入队。"], "sources": [{"path": "internal/chatjob/service.go", "line": 78, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/chatjob/service.go#L78"}, {"path": "internal/platform/postgresql/chat_jobs_sql.go", "line": 28, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/postgresql/chat_jobs_sql.go#L28"}, {"path": "internal/platform/postgresql/chat_jobs_sql.go", "line": 43, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/postgresql/chat_jobs_sql.go#L43"}, {"path": "internal/platform/rabbitmq/consumer.go", "line": 13, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/rabbitmq/consumer.go#L13"}], "question": "为什么既要 Retry 把状态改回 pending，又要 Nack(requeue=true)？", "answer": "前者保证数据库任务能再次被领取；后者保证队列消息再次投递。只改状态没有新投递，只重投递而仍是 processing 则无法正常领取。", "routes": [{"api": "POST /api/v1/conversations/:id/chat-jobs", "module": "jobs", "note": "JWT + Chat 额度；202 返回异步任务 ID。"}, {"api": "GET /api/v1/chat-jobs/:id", "module": "jobs", "note": "JWT；查询任务状态，完成后读取消息历史。"}]}, {"id": "publish", "title": "RabbitMQ 发布确认", "tag": "交付", "intro": "PublishChatJob 等待的是 Broker 的发布确认，不是用户提问的生成结果。", "flow": ["job_id 序列化 JSON", "复用 Connection 创建 AMQP Channel", "NotifyReturn + Confirm(false)", "发到 gopherai.jobs / chat.generate", "WaitContext 等待发布确认", "检查 mandatory Return", "关闭本次 Channel"], "points": ["启动时声明 direct Exchange 与 durable Queue（QueueDeclare 第二个参数 true），并绑定路由键 chat.generate；目标队列是 gopherai.chat.jobs。", "AMQP Channel 是协议通道，chan amqp.Return 是 Go channel。Confirm(false) 的 false 表示 noWait=false，等待开启确认模式的应答。", "mandatory=true 请求无法路由时退回；Persistent 是消息持久化标记，与队列 durable 是两项独立配置。", "收到肯定 Confirm 仍需检查 Return：不可路由的 mandatory 消息也可能被确认，Broker 先发送 Return 再发送 Confirm。", "如果等待确认超时，消息可能未入队，也可能已入队但确认丢失。发布方不能只根据 error 就判断远端没有执行。"], "traps": ["生产者 Confirm 与消费者 Ack 是两段不同的确认。", "Nack 只有指定 requeue=true 才请求重新入队；当前消费者忽略 Ack/Nack/Reject 返回错误是现有边界。"], "sources": [{"path": "internal/platform/rabbitmq/publisher.go", "line": 15, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/rabbitmq/publisher.go#L15"}, {"path": "internal/platform/rabbitmq/broker.go", "line": 55, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/rabbitmq/broker.go#L55"}], "question": "发布返回错误，消费者是不是一定收不到？", "answer": "不一定。若错误发生在发送之前则收不到；消息入队后的确认超时或连接中断仍可能返回错误。", "routes": []}, {"id": "rag", "title": "RAG 上传与检索", "tag": "资料", "intro": "RAG 为模型准备参考资料，不训练模型。一个用户有一份当前文档，所有会话共享。", "flow": ["Upload：校验 txt/md、UTF-8、大小", "SplitText：1000 rune / overlap 150", "Embed：片段转向量", "文件保存原文，Redis Replace 写 chunks", "Activate 切换 current", "Retrieve：问题向量与文档向量比较", "Go 余弦排序，最多取 4 块正文", "拼入模型输入中的本次提问"], "points": ["Redis current key 的值是版本号；versionKey 的值是 chunks JSON，每块包含 index/content/vector。先读 current，再按版本取 chunks。", "Replace 写新版本时有 24 小时 staging TTL；激活时 PERSIST 新版本、SET current、给旧 chunks 设置 24 小时 TTL。不是所有新版本都永久存储。", "激活前 Chat 仍读取原 current；新文档 Embedding 失败不会替换旧文档。文件系统和 Redis 之间没有全局事务。", "Activate 报错可能只是执行成功后的响应丢失，因此保留新原文。若激活没有执行，新 chunks 有 TTL；文件系统原文没有自动过期，定时清理暂不实现。", "fmt.Errorf 的 %w 保留底层错误。Sentinel 可以表达分类，但只有明确证明未生效时才能安全清理；错误分类不能凭空确定远端状态。", "检索读出向量，在 Go 中计算余弦相似度。交给生成模型的是选中的片段正文，不是向量；数据库里的原问题不被 RAG 资料覆盖。"], "traps": ["Lua 的原子执行表示其他命令不会穿插；不是数据库式的出错自动回滚。不能把所有 Lua 错误都当成没有任何写入。", "无文档正常聊天；检索设施故障则停止生成。Activate 的 PERSIST 后若发生脚本中途错误，不能只凭 error 保证 staging TTL 仍存在。"], "sources": [{"path": "internal/rag/service.go", "line": 40, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/rag/service.go#L40"}, {"path": "internal/rag/service.go", "line": 126, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/rag/service.go#L126"}, {"path": "internal/platform/redis/rag_repository.go", "line": 31, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/redis/rag_repository.go#L31"}, {"path": "internal/rag/retriever.go", "line": 8, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/rag/retriever.go#L8"}], "question": "新 chunks 已写入，但 Activate 还没执行，新提问检索哪个版本？", "answer": "仍通过 current 获取旧版本。只有新版本成功激活后 current 才切换；新原文存在不代表它已生效。", "routes": [{"api": "POST /api/v1/rag/documents", "module": "rag", "note": "JWT + 上传额度；multipart 字段 document。"}]}, {"id": "agent", "title": "Agent / MCP 工具调用", "tag": "编排", "intro": "Chat 调用统一的 llm.ModelClient；启用 MCP 时实际对象是 agent.Client。当前仅允许一次 get_weather 调用。", "flow": ["GenerateWithTools：消息 + 工具定义交给模型", "模型返回普通回答或 function call", "0 次工具调用：直接返回", "1 次：MCP Client → MCP Server", "weather.Client 请求天气 Provider", "GenerateWithToolResult：携带 continuation + 工具结果", "汇总两次模型请求的 usage"], "points": ["模型决定是否调用工具；Agent 安排调用顺序；MCP Client 发送工具请求；MCP Server 内的 weather.Client 才实际访问天气 Provider。", "工具参数结构 WeatherInput 由我们定义，MCP SDK 根据 Go struct 生成 JSON Schema。外层 type=object 表示整组命名参数，city 字段才是 string。SDK 不是 Go 标准库。", "functionTools 将内部工具定义转换成 OpenAI SDK 参数，并要求顶层 object；json.Unmarshal 成功与 schema[\"type\"]==\"object\" 检查的是不同问题。", "第二次请求使用同一个配置模型，携带消息、原 output 的 continuation、带 call_id 的工具结果；它是继续回答，不要求更换模型。", "Include reasoning.encrypted_content 用来保留不透明推理内容并回传以接续请求；不是 TLS 传输加密，不是把用户文本全部加密，也不是客户端读取明文思考。", "Agent.Generate / GenerateStream 将规划和最终回答的 token usage 相加。工具 HTTP 查询本身不是一次生成模型请求。"], "traps": ["流式规划正文先缓存：无工具则规划完成后转发；有工具则丢弃缓存，仅转发最终回答。正文 delta 与 encrypted_content 是两类数据。", "agent.Model 的类型断言仅证明本地方法集合满足要求；配置 MCP 时连接/工具发现失败会阻止启动，不自动降级。"], "sources": [{"path": "internal/agent/client.go", "line": 45, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/agent/client.go#L45"}, {"path": "internal/agent/client.go", "line": 84, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/agent/client.go#L84"}, {"path": "internal/platform/mcp/weather_server.go", "line": 19, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/mcp/weather_server.go#L19"}, {"path": "internal/platform/openai/client.go", "line": 230, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/openai/client.go#L230"}], "question": "外层只调用一次 Generate，为什么可能有两次模型用量？", "answer": "Agent 内部先请求模型决定工具调用，再执行工具并第二次请求模型生成答案，最终汇总两次 usage。没有工具调用则直接返回第一次结果。", "routes": []}, {"id": "image", "title": "本地图片分类", "tag": "推理", "intro": "接口接收图片，模型接收数字 tensor；模型输出分数，Go 再转换成类别名称。", "flow": ["multipart image → JPEG/PNG 解码校验", "等比缩放短边到 256", "中心裁剪 224 × 224", "RGB 归一化、HWC → CHW", "加锁：填输入 → session.Run → 读输出", "1000 类分数取最大值下标", "labels 下标 → class_name"], "points": ["输入形状 [1,3,224,224]，输出形状 [1,1000]。模型不是直接返回文字标签，接口也不提供概率或检测框。", "缩放保持比例避免变形；小图也会被放大。中心裁剪舍弃边缘，不保证主体完整保留。", "归一化遵循该模型预处理约定：(pixel/255 - mean)/std；RGB mean 为 0.485/0.456/0.406，std 为 0.229/0.224/0.225。", "每次请求的预处理数组独立；输入输出 tensor 与 session 复用，锁保护填入、运行、读取整个区间，防止请求互相覆盖。", "启动时 NewClassifier 加载 Runtime/模型/标签/tensor；退出时 Close 显式销毁资源，并用同一把锁避免与推理并行销毁。"], "traps": ["这是本地 MobileNetV2 分类，不是多模态聊天，也没有训练本地模型。", "图片上限包含请求体 10 MiB、单边 8192、总像素 2500 万；文件大小与像素总数不是同一个指标。"], "sources": [{"path": "internal/image/service.go", "line": 26, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/image/service.go#L26"}, {"path": "internal/platform/onnx/preprocessing.go", "line": 15, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/onnx/preprocessing.go#L15"}, {"path": "internal/platform/onnx/classifier.go", "line": 132, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/onnx/classifier.go#L132"}], "question": "为什么锁不能只包住 session.Run？", "answer": "输入输出 tensor 也是共享资源；填入前或读取前若被另一请求覆盖，即使 Run 串行也会串数据。", "routes": [{"api": "POST /api/v1/images/recognitions", "module": "image", "note": "JWT；multipart 字段 image，返回 class_name。"}]}, {"id": "tts", "title": "TTS 任务与凭据", "tag": "外部服务", "intro": "任务在百度保存和执行；Go 提交文本、查询状态并转换响应，前端持续轮询。", "flow": ["POST /tts/tasks 校验 text", "accessToken 获取/复用百度凭据", "Provider 创建任务 → task_id", "前端 GET /tts/tasks/:id", "后端单次查询百度并映射状态", "succeeded → audio_url 播放"], "points": ["不创建本地 TTS 任务表，不走 RabbitMQ。创建成功表示受理，不表示音频完成；关闭页面也不会触发百度任务取消。", "任务状态 running/succeeded/failed。running 不应有 URL 或错误；succeeded 必须有 URL、无错误；failed 必须有错误、无 URL。", "validTask 校验状态与字段组合；百度适配层检查 URL 的 http/https 格式与任务 ID，不代表验证了音频一定可下载。", "用户 JWT 验证用户；百度 access_token 验证后端应用。百度 Token 在后端缓存，提前一分钟判断是否需要刷新，互斥锁保护缓存/刷新。", "百度两个凭据都为空时 TTS 关闭并返回 503；只配置一个属于启动配置错误。"], "traps": ["前端轮询，后端 Get 每次只查询一次；本项目没有 TTS 的后台轮询消费者。", "已接受边界：本地不保存 user_id → task_id 严格归属。临时 audio_url 不是永久资产。"], "sources": [{"path": "internal/tts/service.go", "line": 21, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/tts/service.go#L21"}, {"path": "internal/tts/service.go", "line": 71, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/tts/service.go#L71"}, {"path": "internal/platform/baidutts/client.go", "line": 101, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/baidutts/client.go#L101"}], "question": "用户关页后 Go 会持续轮询，或自动取消百度任务吗？", "answer": "都不会。轮询由前端触发；任务由百度维护，本项目没有取消接口或关闭页面时的 Provider 取消流程。", "routes": [{"api": "POST /api/v1/tts/tasks", "module": "tts", "note": "JWT + 创建额度；text 创建百度任务。"}, {"api": "GET /api/v1/tts/tasks/:id", "module": "tts", "note": "JWT；查询状态与 audio_url，不占创建额度。"}]}, {"id": "auth", "title": "账号 / JWT / 资源权限", "tag": "身份", "intro": "密码校验、Token 签名验证、资源归属检查是三个不同步骤。", "flow": ["注册：bcrypt 哈希写 users", "登录：比较输入密码与保存哈希", "签发 HS256 JWT", "请求携带 Bearer Token", "验证签名、issuer、exp、iat", "取 sub 作为可信 userID", "SQL 同时检查资源 ID 与 userID"], "points": ["bcrypt 是带盐密码哈希，不是可解密密文。登录用 CompareHashAndPassword 校验，不需要还原密码。", "JWT = Base64URL(Header).Base64URL(Payload).Signature。Payload 含 sub/iss/iat/exp；HS256 用 JWT_SECRET 对编码后的 Header.Payload 做 HMAC-SHA256。", "不是只哈希 userID，也不与数据库里的另一个 JWT 比较。当前数据库不保存 JWT；解码可读不代表验证可信。", "认证后中间件将 userID 写入请求上下文。删除会话 SQL 用 id 与 user_id 同时筛选，合法 Token 也不能越权删除别人的会话。", "退出仅在客户端清理凭据；当前没有撤销名单/刷新接口。完整有效 Token 被复制后，持有者不需要另知 userID，服务端会从 Token 中取得。", "用户不存在时仍做 dummy bcrypt 比较，以减小存在/不存在账号的耗时差异，主要缓解账号枚举，不保证完全恒时。"], "traps": ["签名防伪造和篡改，不防偷来的完整 Token 被重放；当前有效期一小时。", "新前端尚未实现，sessionStorage 只是前端计划；不能在复习时把它当成已完成的代码。"], "sources": [{"path": "internal/auth/token.go", "line": 61, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/auth/token.go#L61"}, {"path": "internal/httpapi/auth_middleware.go", "line": 15, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/httpapi/auth_middleware.go#L15"}, {"path": "internal/user/service.go", "line": 76, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/user/service.go#L76"}, {"path": "internal/platform/postgresql/conversations_sql.go", "line": 21, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/postgresql/conversations_sql.go#L21"}], "question": "复制的有效 JWT 不知道 userID 也能调用接口吗？", "answer": "能。Token 中有 sub，后端验证后自己提取身份；当前本地退出不能撤销复制品。签名保护与保密是两回事。", "routes": [{"api": "POST /api/v1/auth/register", "module": "auth", "note": "公开；注册成功不返回 Token。"}, {"api": "POST /api/v1/auth/login", "module": "auth", "note": "公开；返回 access_token 与 token_type。"}, {"api": "GET /api/v1/users/me", "module": "auth", "note": "JWT；读取当前用户。"}]}, {"id": "email", "title": "邮箱验证码", "tag": "一次性凭据", "intro": "先保存验证码再发信，验证成功立即消费；注册数据库写入是之后的另一步。", "flow": ["生成六位随机数字字符串", "Lua 检查冷却并保存 code / cooldown", "SMTP 发信", "失败按本次 code 补偿删除", "Lua 验证并消费或累计错误次数", "PostgreSQL 创建用户"], "points": ["默认验证码有效十分钟、同邮箱发送间隔一分钟、最多五次验证尝试；启用与规则由配置决定。六位字符串保留前导零。", "检查冷却和保存必须原子：否则并发请求 A/B 都看到无冷却，分别发信，后写验证码覆盖前者。", "验证和删除必须原子：防止两个并发请求都验证通过，同一凭据使用两次。", "保存成功但 SMTP 失败时，按本次验证码匹配后删除，避免错误清理新验证码；补偿也可能失败。", "验证码消费后创建用户失败，不恢复验证码。这是当前接受的一次性凭据语义；用户重发，可能仍在冷却期。"], "traps": ["Redis 消费和 PostgreSQL 注册不属于一个事务，但不等于必须回滚验证码。业务口径可以选择成功验证即作废。", "发送未启用或设施故障都可能返回 503；邮箱冷却的业务 429 不一定带 Retry-After。"], "sources": [{"path": "internal/emailverification/service.go", "line": 77, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/emailverification/service.go#L77"}, {"path": "internal/platform/redis/email_verification_repository.go", "line": 47, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/redis/email_verification_repository.go#L47"}, {"path": "internal/user/service.go", "line": 42, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/user/service.go#L42"}], "question": "为什么不能先 GET 验证码比较成功，再独立 DEL？", "answer": "两个并发请求可能都先读取并通过校验，然后分别删除；Lua 将校验和消费合在一起，只有一个请求能成功消费。", "routes": [{"api": "POST /api/v1/auth/email-verification-codes", "module": "email", "note": "公开；发送验证码，可选功能。"}]}, {"id": "limit", "title": "请求限流", "tag": "入口控制", "intro": "从首次请求起建立固定时长窗口；统计的是请求次数，不是同时运行的任务数。", "flow": ["认证用户取 userID；公开认证接口取直连 IP", "Lua INCR", "第一次请求设置 PEXPIRE", "读取 PTTL", "current ≤ limit 则进入 Handler", "超额 429 + Retry-After；设施异常 503"], "points": ["Chat 默认 10 次/分钟/用户，普通 Chat、SSE 和创建 ChatJob 共用同一个 key。RAG 3 次/小时，TTS 创建 5 次/小时，均可配置。", "注册 10 次/10 分钟/IP，登录 20 次/5 分钟/IP，验证码 10 次/小时/IP。按直连 IP，不信任转发 Header；统一代理后可能共享来源额度。", "只有 current=1 设置 TTL。若每次都刷新 TTL，持续请求会不断延后清零，被拒绝的请求也会延长等待。当前不是滑动窗口或令牌桶。", "计数发生在 Handler 之前；通过限流后业务失败不退额度。超过额度的尝试也会 INCR，但不会延长 TTL。", "RabbitMQ 重投递直接进入 Process，不经过 HTTP 限流；Job/TTS 查询不消耗创建额度。Redis 限流不可用时拒绝放行。"], "traps": ["共用额度的本质是相同 limiter 身份和 Redis key，不只是“用了同一个中间件函数”。", "限制每分钟次数不等于限制并发，也不是完整费用预算。"], "sources": [{"path": "internal/platform/redis/rate_limiter.go", "line": 26, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/platform/redis/rate_limiter.go#L26"}, {"path": "internal/httpapi/rate_limit_middleware.go", "line": 55, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/httpapi/rate_limit_middleware.go#L55"}, {"path": "cmd/server/bootstrap.go", "line": 56, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/cmd/server/bootstrap.go#L56"}], "question": "同窗口普通 Chat 发起 6 次、SSE 发起 4 次，还能创建 ChatJob 吗？后台重试会加次数吗？", "answer": "新建 Job 会超额。三种创建请求共用额度；已创建 Job 在后台重试不再经过 HTTP 限流，不额外计入此次数。", "routes": []}, {"id": "life", "title": "启动 / 健康 / 退出", "tag": "生命周期", "intro": "依赖准备好再监听；运行时监控 HTTP 和消费者；信号退出时停止接入并清理资源。", "flow": ["Compose 等依赖健康与 migration 成功", "run 校验配置、加载 ONNX、连接 PG/模型/MCP/Redis/MQ", "组装模块，启动消费者与 HTTP", "select 等 HTTP 错误 / 消费循环错误 / 信号", "信号：取消消费者 context", "HTTP Shutdown 等待请求，共用五秒等待预算", "run 返回，defer 释放连接与 ONNX"], "points": ["资源创建成功就注册 defer，启动后续步骤失败时也能清理已创建资源。SIGKILL/进程崩溃不能保证执行 defer。", "/healthz 是存活响应；/readyz 当前只 Ping PostgreSQL 和 Redis，整体检查超时两秒，不证明模型/MCP/SMTP/TTS 可用。", "单个 Job 模型失败走任务重试/终态；消费通道异常关闭表示消费循环停止，错误传给 main 后导致进程退出，不一定是 RabbitMQ 整台服务挂掉。", "信号退出时 rabbitMQCancel 取消派生的 Job context，让其停止工作并尝试收尾；HTTP Shutdown 本身不立即取消活跃 Handler，而是等待其结束。", "五秒是退出等待 context 的预算，不是整个进程与所有资源必在五秒内关闭的保证；长 Chat 可能来不及完成。异常退出分支也不等于完整走信号关闭流程。", "关闭数据库连接不等于关闭数据库容器；defer 释放的是进程持有的资源。Compose restart 策略是进程退出后的外层处理。"], "traps": ["已取消的 Job 不是必然继续生成到完成；取消后仍要尝试 Retry/Fail 等收尾，数据库故障会暴露已知恢复缺口。", "数据卷能保留数据，不等于已有处理任务必然可恢复，也不能替代备份。"], "sources": [{"path": "cmd/server/main.go", "line": 29, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/cmd/server/main.go#L29"}, {"path": "cmd/server/main.go", "line": 200, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/cmd/server/main.go#L200"}, {"path": "internal/health/checker.go", "line": 22, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/internal/health/checker.go#L22"}, {"path": "scripts/migrate.sh", "line": 7, "url": "https://github.com/via2004/gopher-agent-platform/blob/77a8ad97a92ca4bfd9af0e340dcbb4729a5c74e1/scripts/migrate.sh#L7"}], "question": "为什么“等 HTTP 请求结束”和“等消费者退出”不是同一种等待？", "answer": "HTTP Shutdown 等活跃请求收尾，不主动取消所有 Handler；消费者先收到取消信号，其派生 Job context 也被取消，等待的是停止与收尾退出。", "routes": [{"api": "GET /healthz", "module": "life", "note": "公开；存活响应，不检查外部模型。"}, {"api": "GET /readyz", "module": "life", "note": "公开；只检查 PostgreSQL 与 Redis。"}]}], "scenarios": [{"id": "chat-ok", "title": "普通 Chat · 成功", "module": "chat", "steps": [{"title": "收到提问", "who": "Handler", "detail": "取得 Token 中的 userID、URL 中的会话 ID 和 content。", "state": {"用户消息": "尚未写入", "调用记录": "尚未创建"}}, {"title": "事务 A 提交", "who": "Chat / PostgreSQL", "detail": "提问与 running 调用记录一起提交。", "state": {"用户消息": "已保存", "调用记录": "running"}}, {"title": "准备与生成", "who": "RAG / 模型客户端", "detail": "取最近历史，按需补资料，事务外等待生成。", "state": {"用户消息": "已保存", "调用记录": "running", "AI回复": "仅在内存"}}, {"title": "事务 B 提交", "who": "Chat / PostgreSQL", "detail": "完整回复与 completed 调用记录一起提交。", "state": {"用户消息": "已保存", "调用记录": "completed", "AI回复": "已保存"}}, {"title": "返回答案", "who": "Handler", "detail": "返回持久化后的消息与模型 usage。", "state": {"HTTP": "200", "结果": "成功"}}]}, {"id": "chat-fail", "title": "普通 Chat · 模型超时", "module": "chat", "steps": [{"title": "事务 A 已提交", "who": "Chat", "detail": "用户提问已经保存。", "state": {"用户消息": "已保存", "调用记录": "running"}}, {"title": "模型超时", "who": "模型客户端", "detail": "context.DeadlineExceeded 返回到 respond。", "state": {"AI回复": "未保存", "调用记录": "running"}}, {"title": "尝试失败收尾", "who": "Chat", "detail": "以下假设数据库正常：使用独立五秒 context 更新原记录。", "state": {"用户消息": "仍保留", "调用记录": "timed_out", "错误码": "llm_timed_out"}}, {"title": "返回错误", "who": "Handler", "detail": "HTTP 超时错误和数据库调用状态不是同一个字段。", "state": {"HTTP": "504", "响应code": "TIMEOUT"}}]}, {"id": "sse-fail", "title": "SSE · 正文已显示但落库失败", "module": "sse", "steps": [{"title": "增量到达", "who": "Handler → 浏览器", "detail": "文字通过 delta 展示，还没有持久化完整回复。", "state": {"浏览器": "已有正文", "调用记录": "running"}}, {"title": "上游生成完成", "who": "模型适配层", "detail": "收到 response.completed 并返回完整 Result。", "state": {"Provider": "已完成", "数据库": "尚未完成"}}, {"title": "事务 B 的 Complete 失败", "who": "PostgreSQL", "detail": "假设该事务回滚正常，已插入的 AI 回复随事务回滚。", "state": {"用户消息": "保留", "AI回复": "未提交"}}, {"title": "失败收尾与事件", "who": "Service → Handler", "detail": "尝试记录失败，发送 error；连接断开时事件也可能送不到。", "state": {"SSE": "error，不发 done", "浏览器": "不能标成功"}}]}, {"id": "sse-unknown", "title": "SSE · 最后事件丢失", "module": "sse", "steps": [{"title": "生成结束并提交", "who": "Service", "detail": "完整回复和 completed 调用记录已落库。", "state": {"数据库": "completed", "AI回复": "已保存"}}, {"title": "发送 done 时断线", "who": "网络", "detail": "客户端没有得到最终确认。", "state": {"浏览器": "没收到 done", "服务端": "已经成功"}}, {"title": "重新查询历史", "who": "前端", "detail": "先确认结果，不能自动重放 POST。", "state": {"结果": "找到已保存的 AI 回复", "动作": "对齐历史"}}]}, {"id": "job-retry", "title": "ChatJob · 正常重试", "module": "jobs", "steps": [{"title": "提交任务", "who": "HTTP / Job Service", "detail": "假设 maxAttempts=3。创建 Job 时尚未创建用户消息。", "state": {"Job": "pending", "attempt_count": "0"}}, {"title": "发布并受理", "who": "RabbitMQ / HTTP", "detail": "队列传 job_id，HTTP 返回 202。", "state": {"队列": "待投递", "客户端": "持有 Job ID"}}, {"title": "首次领取", "who": "消费者 / SQL", "detail": "pending → processing，次数加一，创建或复用提问。", "state": {"Job": "processing", "attempt_count": "1", "用户消息": "已关联"}}, {"title": "生成失败后恢复状态", "who": "Job Service", "detail": "Retry 只改回 pending，不清除次数和用户消息。", "state": {"Job": "pending", "attempt_count": "1"}}, {"title": "Nack 并重投递", "who": "消费者 / RabbitMQ", "detail": "Process 返回错误；Nack(requeue=true) 触发重投递。", "state": {"队列": "重新投递", "HTTP限流": "不再计数"}}, {"title": "再次领取并成功", "who": "消费者 / Chat", "detail": "次数变 2，复用用户消息并保存回复。", "state": {"Job": "completed", "attempt_count": "2", "队列": "Ack"}}]}, {"id": "job-orphan", "title": "ChatJob · 已知 processing 缺口", "module": "jobs", "steps": [{"title": "最后一次尝试失败", "who": "Job Service", "detail": "本次已达上限，应写 failed 结束。", "state": {"Job": "processing", "attempt_count": "3 / 3"}}, {"title": "Fail 写入未生效", "who": "PostgreSQL 故障", "detail": "Process 返回错误，消费者 Nack。", "state": {"Job": "仍 processing", "队列": "重新入队"}}, {"title": "数据库恢复，重新领取", "who": "ClaimForProcessing", "detail": "当前 SQL 仅接受 pending，processing 无法领取。", "state": {"领取结果": "ErrJobNotClaimable"}}, {"title": "当前代码误结束投递", "who": "Process / Consumer", "detail": "ErrJobNotClaimable 被统一当成 nil，再 Ack。", "state": {"Job": "遗留 processing", "队列": "已确认结束", "方案": "恢复机制暂缓实施"}}]}, {"id": "rag-switch", "title": "RAG · 版本切换", "module": "rag", "steps": [{"title": "旧版本生效", "who": "Redis", "detail": "示例版本号 v1/v2 用于说明；实际版本是 UUID。", "state": {"current": "v1", "v  {"title": "返回并清理", "who": "run / defer", "detail": "等待成功或返回错误后清理连接和 ONNX；实际资源关闭仍有自身行为。", "state": {"数据库容器": "不关闭", "资源": "关闭本进程持有的资源"}}]}], "pitfalls": [["事务只包住使用同一个 tx 的 SQL", "同一个连接池不等于同一个事务；把函数放进闭包也不会自动让 pool 上的 SQL 加入 tx。", "chat"], ["模型完成 ≠ 数据库完成 ≠ 前端确认", "response.completed 后还要事务 B；done 是应用完成确认；没有收到 done 也可能数据库已提交。", "sse"], ["只有 ChatJob 走队列重试", "普通 Chat 和 SSE 不自动绑定 Job；Job 使用非流式 Generate，RabbitMQ 传递的是 job_id。", "jobs"], ["Ack 表示投递处理结束", "failed 已保存也可 Ack；Process error 才 Nack。当前不可领取分支会留下恢复缺口。", "jobs"], ["执行次数在领取时增加", "当前 attempt_count 包含首次执行，Retry 只恢复 pending；方案中的 StartAttempt 尚未实现。", "jobs"], ["客户端错误不能证明远端没执行", "发布确认超时、RAG 激活应答丢失都是结果不确定；%w 不会抹掉底层错误。", "publish"], ["current 的值是版本号", "versionKey 的值才是 chunks JSON。新 staging 与旧版本有 TTL，激活的当前版本没有 TTL。", "rag"], ["SDK、标准与自己的定义分开", "WeatherInput 是我们定义的 Go struct，MCP SDK 按 JSON Schema 标准生成 object schema。", "agent"], ["类型断言不会给对象添加能力", "base.(agent.Model) 检查方法集合；具体对象和动态值没有被改造成另一个模型。", "layers"], ["encrypted_content 不是传输加密", "它是不透明的推理延续数据。planningDeltas 是正文缓存，不是同一份数据。", "agent"], ["模型接收 tensor，输出分类分数", "接口输入图片，Go 预处理并通过最大分数下标映射标签；锁覆盖共享 tensor 的写入与读取。", "image"], ["JWT 验签不查询数据库里的 JWT", "HS256 用密钥验证完整 Header.Payload，之后才信任 sub；资源归属另查 SQL。", "auth"], ["固定窗口不是滑动窗口", "只在首次 INCR 设置 TTL，持续请求不延期；限请求次数不等于限并发。", "limit"], ["退出等待分两条路径", "HTTP Shutdown 等活跃请求；消费者先被取消，等待其停止与收尾。", "life"]], "boundaries": [["已接受 / 暂缓", "Job 写库与 MQ 发布非原子；未入队的 pending 无自动补发。"], ["已确认 / 暂缓修复", "processing 遗留与误 Ack 缺口；docs/CHATJOB_RECOVERY_PLAN.md 仅是未来方案，没有 lease、claim_version 或接管逻辑。"], ["已接受 / 暂缓", "RAG 原文件无定时孤儿清理；激活结果不确定时保守保留。"], ["已接受", "TTS 无本地用户与任务 ID 严格归属表。"], ["现有安全边界", "JWT 无服务端退出撤销或 refresh，复制的有效 Token 仍可能使用。"], ["产品边界", "一次天气工具调用；单用户一份当前文档；图片仅返回类别名；不支持前端选模型。"], ["能力表述边界", "没有基于本次梳理新增压测、恢复、RAG 质量评估证据；不宣称高可用、exactly-once 或完整生产能力。"]]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent);
const content=document.getElementById('content');
const tabs=[['overview','架构总览'],['module','模块详解'],['scenario','流程推演'],['pitfalls','易混概念'],['quiz','场景自测']];
let view='overview', moduleId='chat', sceneId='chat-ok', stepIndex=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moduleById=id=>data.modules.find(m=>m.id===id);
const moduleLink=(id,label)=>`<button class="textbutton" data-module="${esc(id)}">${esc(label||moduleById(id).title)} →</button>`;
const ul=items=>`<ul class="prose-list">${items.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
function heading(kicker,title,desc,badge=''){return `<div class="heading"><div><p class="eyebrow">${esc(kicker)}</p><h1>${esc(title)}</h1><p class="lede">${esc(desc)}</p></div>${badge?`<span class="badge">${esc(badge)}</span>`:''}</div>`;}
function shell(){
 document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button data-view="${id}" aria-current="${view===id?'page':'false'}">${label}</button>`).join('');
 document.getElementById('module-nav').innerHTML=data.modules.map((m,i)=>`<button data-module="${m.id}" aria-current="${view==='module'&&m.id===moduleId}"><span>${String(i+1).padStart(2,'0')}</span>${esc(m.title)}</button>`).join('');
 document.getElementById('mobile-module').innerHTML=`<option value="">从模块进入…</option>`+data.modules.map(m=>`<option value="${m.id}" ${view==='module'&&m.id===moduleId?'selected':''}>${esc(m.title)}</option>`).join('');
}
function architecture(){
 const nodes=[['layers','API 调用方','浏览器 / 客户端',0,8],['auth','Gin HTTP','认证 · 限流 · Handler',21,8],['chat','Chat Service','两段短事务',42,8],['agent','Agent / Model','工具编排',63,8],['agent','Responses','外部生成 Provider',84,8],['jobs','ChatJob','创建 pending',21,38],['publish','RabbitMQ','队列仅含 job_id',42,38],['jobs','消费者','同 Backend 进程',63,38],['chat','PostgreSQL','消息 · 调用 · Job',0,68],['rag','RAG Service','上传 / 检索',42,68],['rag','Embedding','片段 / 问题 → 向量',63,68],['rag','Redis / Valkey','chunks + current',84,68]];
 const boxes=nodes.map(([id,title,sub,x,y])=>`<button class="node ${['chat','agent','jobs','rag'].includes(id)?'active-node':''}" style="left:${x}%;top:${y}%" data-module="${id}" aria-label="查看${esc(title)}相关模块"><strong>${esc(title)}</strong><small>${esc(sub)}</small></button>`).join('');
 return `<div class="graph" aria-label="核心后端架构，箭头表示调用或依赖方向"><svg viewBox="0 0 1000 385" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" style="fill:#93a5b2;stroke:none"/></marker></defs><g marker-end="url(#arrow)"><path d="M150 62 H210"/><path d="M360 62 H420"/><path d="M570 62 H630"/><path d="M780 62 H840"/><path d="M285 93 V146"/><path d="M360 177 H420"/><path d="M570 177 H630"/><path d="M705 146 V119 H495 V94"/><path d="M420 70 H397 V239 H75 V262"/><path d="M455 94 V127 H393 V292 H420"/><path d="M570 292 H630"/><path d="M570 313 H812 V292 H840"/></g><text x="312" y="130" class="edge-name">异步提交</text><text x="552" y="112" class="edge-name">复用 Chat</text><text x="195" y="233" class="edge-name">持久化 / 查询</text><text x="813" y="340" class="edge-name">分块向量</text></svg>${boxes}</div>`;
}
function overview(){return heading('SYSTEM MAP / 系统总览','沿着一次请求，理解整个后端','从入口到持久化结果。点击图中模块展开职责；到“流程推演”观察成功、失败和结果不确定时的状态。','已实现行为')+
`<section class="diagram-wrap"><div class="panel-head"><h2>核心生成链与异步入口</h2><span class="badge">箭头 = 调用 / 依赖</span></div>${architecture()}<div class="mobile-map"><div class="mobile-route"><strong>普通 / 流式主线</strong><p>${moduleLink('auth','HTTP 入口')} → ${moduleLink('chat','Chat')} → ${moduleLink('agent','Agent / Provider')}</p></div><div class="mobile-route"><strong>异步主线</strong><p>${moduleLink('jobs','ChatJob')} → ${moduleLink('publish','RabbitMQ')} → 消费者 → Chat</p></div><div class="mobile-route"><strong>上下文与存储</strong><p>Chat → ${moduleLink('rag','RAG')} → Embedding / Redis；消息与调用记录 → PostgreSQL</p></div></div><div class="parallel"><div class="chain"><button data-module="agent">Agent</button><span>→ MCP Client → 独立 MCP Server → weather.Client → 天气 Provider</span></div><div class="chain"><button data-module="rag">RAG 上传</button><span>→ 原文写文件卷；分块与向量写 Redis，切换 current</span></div><div class="chain"><button data-module="image">图片识别</button><span>→ 进程内 ONNX Runtime → 类别名</span><button data-module="tts">TTS</button><span>→ 百度任务 → 前端轮询</span></div><div class="chain"><button data-module="email">邮箱验证</button><span>→ Redis 临时状态 + SMTP</span><button data-module="limit">限流</button><span>→ Redis 计数</span></div></div><p class="caption">逻辑示意，未表示调用频率或耗时。外部返回值沿调用链返回；存储不都在 PostgreSQL。</p></section>
<div class="split"><section><h2>数据放在哪里</h2><dl class="storage"><dt>PostgreSQL</dt><dd>users / conversations / messages / model_calls / chat_jobs</dd><dt>Redis / Valkey</dt><dd>限流、验证码、分块正文和向量、current 版本号</dd><dt>文件系统卷</dt><dd>RAG 原始文档，无定时孤儿清理</dd><dt>RabbitMQ</dt><dd>job_id，不保存最终回答正文</dd><dt>进程内存</dt><dd>ONNX session 与 tensor、百度 Token 缓存</dd><dt>百度 Provider</dt><dd>TTS 任务和临时音频</dd></dl></section><section><h2>先记住三条路径</h2><ol class="reading"><li><strong>Chat</strong>：等完整回答与落库后返回。</li><li><strong>SSE</strong>：边接收正文边展示，落库后发 done。</li><li><strong>ChatJob</strong>：先返回任务 ID，后台非流式生成，前端查询。</li></ol><div class="note"><strong>当前边界</strong><br>Job 重试只属于异步入口。遗留 processing 接管仍是待实施方案；不能把“队列重试”理解为所有故障自动恢复。</div><div class="section linklist"><button class="primary" data-view="scenario">开始流程推演</button><a href="BACKEND_REVIEW.md" download>保存完整中文复习手册</a></div></section></div>`;}
function moduleView(){const m=moduleById(moduleId);return heading(`${m.tag} / MODULE ${String(data.modules.indexOf(m)+1).padStart(2,'0')}`,m.title,m.intro)+`<div class="split"><section><h2>执行顺序</h2><ol class="flow">${m.flow.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="sources"><h3>对照代码 · 固定到 ${data.sha.slice(0,7)}</h3>${m.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.path)}:${s.line} ↗</a>`).join('')}</div></section><section><h2>关键理解</h2>${ul(m.points)}</section></div>${m.routes.length?`<section class="facts"><h2>HTTP 入口</h2>${m.routes.map(r=>`<div class="endpoint"><code>${esc(r.api)}</code><p>${esc(r.note)}</p></div>`).join('')}</section>`:''}<section class="facts"><h2>特别注意</h2>${ul(m.traps)}</section><section class="qa"><h3>停下来想一想</h3><p>${esc(m.question)}</p><details><summary>展开参考答案</summary><p>${esc(m.answer)}</p></details></section><div class="step-controls"><span class="caption">只展开当前模块，避免丢失主线。</span><div class="buttons"><button data-module="${data.modules[Math.max(0,data.modules.indexOf(m)-1)].id}" ${data.modules.indexOf(m)===0?'disabled':''}>上一模块</button><button class="primary" data-module="${data.modules[Math.min(data.modules.length-1,data.modules.indexOf(m)+1)].id}" ${data.modules.indexOf(m)===data.modules.length-1?'disabled':''}>下一模块</button></div></div>`;}
function scenarioView(){const s=data.scenarios.find(x=>x.id===sceneId), st=s.steps[stepIndex];return heading('TRACE / 状态推演','把“执行了”与“确认了”分开看','以下是教学场景，不是实际服务运行状态。选择场景，再逐步查看执行者和数据变化。','离线推演')+`<div class="scenario-bar"><label for="scenario-select">选择场景</label><select id="scenario-select">${data.scenarios.map(x=>`<option value="${x.id}" ${s.id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${moduleLink(s.module,'查看对应模块')}</div><div class="sim-layout"><div class="steps" aria-label="执行步骤">${s.steps.map((x,i)=>`<button class="step-btn" data-step="${i}" aria-current="${i===stepIndex?'step':'false'}"><span>${String(i+1).padStart(2,'0')}</span>${esc(x.title)}</button>`).join('')}</div><section class="sim-stage" aria-live="polite"><div class="stage-index">STEP ${stepIndex+1} / ${s.steps.length}</div><h2>${esc(st.title)}</h2><div class="actor">执行者：${esc(st.who)}</div><p>${esc(st.detail)}</p><dl class="state">${Object.entries(st.state).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section></div><div class="step-controls"><button data-step="0" ${stepIndex===0?'disabled':''}>重新开始</button><div class="buttons"><button data-step="${stepIndex-1}" ${stepIndex===0?'disabled':''}>上一步</button><button class="primary" data-step="${stepIndex+1}" ${stepIndex===s.steps.length-1?'disabled':''}>下一步</button></div></div>`;}
function pitfallsView(){return heading('MENTAL MODEL / 概念校准','这轮讨论里，最容易混淆的地方','复习时先尝试用自己的话解释，再进入对应模块核对实现。')+`<div class="pitfall-list">${data.pitfalls.map(([t,p,id],i)=>`<section class="pitfall"><p class="eyebrow">${String(i+1).padStart(2,'0')}</p><h2>${esc(t)}</h2><p>${esc(p)}</p>${moduleLink(id)}</section>`).join('')}</div><section class="boundaries"><h2>留在边界内：当前还没实现什么</h2><ul>${data.boundaries.map(([t,p])=>`<li><strong>${esc(t)}</strong> · ${esc(p)}</li>`).join('')}</ul></section>`;}
function quizView(){return heading('RECALL / 场景自测','能预测结果，才算理解流程','先回答“已经写入什么、下一步会发生什么”，再展开参考答案。这里不自动判分。')+`<div class="quiz-top"><span class="badge">13 道场景题</span><button id="toggle-answers">展开全部答案</button></div><div class="quiz-list">${data.modules.map((m,i)=>`<section class="quiz-row"><p class="meta">${String(i+1).padStart(2,'0')} / ${esc(m.title)}</p><h2>${esc(m.question)}</h2><details><summary>查看参考答案</summary><p>${esc(m.answer)}</p></details></section>`).join('')}</div>`;}
function render(){shell();content.innerHTML=({overview,module:moduleView,scenario:scenarioView,pitfalls:pitfallsView,quiz:quizView}[view])();document.title=`${tabs.find(t=>t[0]===view)[1]} · GopherAI 后端复习地图`;}
function navigate(v,id){view=v;if(id)moduleId=id;render();window.scrollTo({top:0,behavior:'instant'});content.focus({preventScroll:true});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.module){navigate('module',b.dataset.module);return;}if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.step!==undefined){const sc=data.scenarios.find(x=>x.id===sceneId);stepIndex=Math.max(0,Math.min(sc.steps.length-1,Number(b.dataset.step)));render();content.querySelector('.sim-stage').scrollIntoView({block:'nearest'});const active=content.querySelector(`[data-step="${stepIndex}"]`);if(active)active.focus({preventScroll:true});return;}if(b.id==='toggle-answers'){const items=[...content.querySelectorAll('details')];const open=items.some(x=>!x.open);items.forEach(x=>x.open=open);b.textContent=open?'收起全部答案':'展开全部答案';}if(b.id==='print')window.print();});
document.addEventListener('change',e=>{if(e.target.id==='scenario-select'){sceneId=e.target.value;stepIndex=0;render();document.getElementById('scenario-select').focus();}if(e.target.id==='mobile-module'&&e.target.value)navigate('module',e.target.value);});
render();
</script>
</body>
</html>
